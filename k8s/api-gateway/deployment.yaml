apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: fintech

spec:
  replicas: 2

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0

  selector:
    matchLabels:
      app: api-gateway

  template:
    metadata:
      labels:
        app: api-gateway

    spec:
      terminationGracePeriodSeconds: 30

      containers:
        - name: api-gateway

          image: distributed-fintech-api-gateway:story7-aws
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8081

          envFrom:
            - configMapRef:
                name: fintech-config
            - secretRef:
                name: fintech-secrets

          env:
            - name: SERVER_PORT
              value: "8081"

            - name: REDIS_HOST
              value: "redis"

            - name: REDIS_PORT
              value: "6379"

            - name: IDENTITY_SERVICE_URL
              value: "http://identity-service:8082"

            - name: PAYMENT_SERVICE_URL
              value: "http://payment-service:8083"

            - name: LEDGER_SERVICE_URL
              value: "http://ledger-service:8084"

            - name: NOTIFICATION_SERVICE_URL
              value: "http://notification-service:8085"

            - name: MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED
              value: "true"

            - name: SERVER_SHUTDOWN
              value: "graceful"

            - name: SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE
              value: "20s"

            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=70.0 -XX:InitialRAMPercentage=20.0"

          resources:
            requests:
              cpu: "150m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 90

          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8081
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
            successThreshold: 1

          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3

          lifecycle:
            preStop:
              exec:
                command:
                  - sh
                  - -c
                  - sleep 5
