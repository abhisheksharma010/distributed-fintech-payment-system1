apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity-service
  namespace: fintech

spec:
  replicas: 2

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0

  selector:
    matchLabels:
      app: identity-service

  template:
    metadata:
      labels:
        app: identity-service

    spec:
      terminationGracePeriodSeconds: 30

      containers:
        - name: identity-service

          image: ghcr.io/abhisheksharma010/distributed-fintech-identity-service:f4c652b
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8082

          envFrom:
            - configMapRef:
                name: fintech-config
            - secretRef:
                name: fintech-secrets

          env:
            - name: SERVER_PORT
              value: "8082"

            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://postgres:5432/identity_db"

            - name: SPRING_DATASOURCE_USERNAME
              value: "fintech_user"

            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fintech-secrets
                  key: DB_PASSWORD

            - name: SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE
              value: "5"

            - name: SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE
              value: "1"

            - name: MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED
              value: "true"

            - name: SERVER_SHUTDOWN
              value: "graceful"

            - name: SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE
              value: "20s"

            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=70.0 -XX:InitialRAMPercentage=20.0"

          resources:
            requests:
              cpu: "150m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8082
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 90

          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8082
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
            successThreshold: 1

          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8082
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3

          lifecycle:
            preStop:
              exec:
                command:
                  - sh
                  - -c
                  - sleep 5
