apiVersion: apps/v1
kind: Deployment
metadata:
  name: zipkin
  namespace: fintech

spec:
  replicas: 1

  selector:
    matchLabels:
      app: zipkin

  template:
    metadata:
      labels:
        app: zipkin

    spec:
      containers:
        - name: zipkin
          image: openzipkin/zipkin:latest

          ports:
            - name: http
              containerPort: 9411

---
apiVersion: v1
kind: Service
metadata:
  name: zipkin
  namespace: fintech

spec:
  type: ClusterIP

  selector:
    app: zipkin

  ports:
    - name: http
      port: 9411
      targetPort: 9411
