apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: fintech
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s

    scrape_configs:
      - job_name: api-gateway
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ['api-gateway:8081']

      - job_name: identity-service
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ['identity-service:8082']

      - job_name: payment-service
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ['payment-service:8083']

      - job_name: ledger-service
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ['ledger-service:8084']

      - job_name: notification-service
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ['notification-service:8085']
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: fintech
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:latest
          args:
            - --config.file=/etc/prometheus/prometheus.yml
          ports:
            - containerPort: 9090
          resources:
            requests:
              cpu: 5m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: fintech
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
