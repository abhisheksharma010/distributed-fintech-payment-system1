version: '3.9'

services:

  postgres:
    image: postgres:16
    container_name: fintech-postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USERNAME:-fintech_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-fintech_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    networks:
      - fintech-network


  redis:
    image: redis:7
    container_name: fintech-redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - fintech-network


  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: fintech-zookeeper
    restart: always
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    ports:
      - "2181:2181"
    networks:
      - fintech-network


  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: fintech-kafka
    restart: always
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:

      KAFKA_BROKER_ID: 1

      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092

      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

    networks:
      - fintech-network


volumes:
  postgres_data:

networks:
  fintech-network:
    driver: bridge