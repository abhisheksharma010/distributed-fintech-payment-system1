name: CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read
  checks: write
  packages: write

jobs:
  detect-changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest

    outputs:
      services: ${{ steps.detect.outputs.services }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect changed services
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          ALL_SERVICES='[
            "api-gateway",
            "identity-service",
            "payment-service",
            "ledger-service",
            "notification-service"
          ]'

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi

          HEAD="${{ github.sha }}"

          if [[ -z "$BASE" || "$BASE" =~ ^0+$ ]]; then
            echo "No valid base SHA. Running all services."
            echo "services=$(echo "$ALL_SERVICES" | jq -c .)" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Base: $BASE"
          echo "Head: $HEAD"

          CHANGED_FILES="$(git diff --name-only "$BASE" "$HEAD")"

          echo "Changed files:"
          echo "$CHANGED_FILES"

          if echo "$CHANGED_FILES" | grep -Eq \
            '^(\.github/workflows/ci\.yml|docker-compose\.yml|docker/|infrastructure/)'; then

            echo "Shared configuration changed. Running all services."
            echo "services=$(echo "$ALL_SERVICES" | jq -c .)" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          SERVICES=()

          if echo "$CHANGED_FILES" | grep -q '^api-gateway/'; then
            SERVICES+=("api-gateway")
          fi

          if echo "$CHANGED_FILES" | grep -q '^identity-service/'; then
            SERVICES+=("identity-service")
          fi

          if echo "$CHANGED_FILES" | grep -q '^payment-service/'; then
            SERVICES+=("payment-service")
          fi

          if echo "$CHANGED_FILES" | grep -q '^ledger-service/'; then
            SERVICES+=("ledger-service")
          fi

          if echo "$CHANGED_FILES" | grep -q '^notification-service/'; then
            SERVICES+=("notification-service")
          fi

          if [[ ${#SERVICES[@]} -eq 0 ]]; then
            JSON='[]'
          else
            JSON="$(printf '%s\n' "${SERVICES[@]}" | jq -R . | jq -s -c .)"
          fi

          echo "Services to validate: $JSON"
          echo "services=$JSON" >> "$GITHUB_OUTPUT"


  service-ci:
    name: CI - ${{ matrix.service }}

    needs:
      - detect-changes

    if: ${{ needs.detect-changes.outputs.services != '[]' }}

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.detect-changes.outputs.services) }}

    defaults:
      run:
        working-directory: ${{ matrix.service }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Verify Java
        run: java -version

      # -----------------------------------------------------
      # PostgreSQL
      # -----------------------------------------------------

      - name: Start PostgreSQL
        if: |
          matrix.service == 'identity-service' ||
          matrix.service == 'payment-service' ||
          matrix.service == 'ledger-service' ||
          matrix.service == 'notification-service'
        working-directory: .
        run: |
          docker compose up -d postgres
          
          for i in {1..30}; do
            if docker exec fintech-postgres \
              pg_isready -U fintech_user -d postgres; then
              echo "PostgreSQL is ready"
              exit 0
            fi
          
            sleep 2
          done
          
          echo "PostgreSQL failed to become ready"
          docker compose logs postgres
          exit 1

      # -----------------------------------------------------
      # Redis
      # -----------------------------------------------------

      - name: Start Redis
        if: |
          matrix.service == 'api-gateway' ||
          matrix.service == 'ledger-service'
        working-directory: .
        run: |
          docker compose up -d redis
          
          for i in {1..30}; do
            if docker exec fintech-redis \
              redis-cli ping | grep -q PONG; then
              echo "Redis is ready"
              exit 0
            fi
          
            sleep 2
          done
          
          echo "Redis failed to become ready"
          docker compose logs redis
          exit 1

      # -----------------------------------------------------
      # Kafka + ZooKeeper
      # -----------------------------------------------------

      - name: Start Kafka
        if: |
          matrix.service == 'payment-service' ||
          matrix.service == 'ledger-service' ||
          matrix.service == 'notification-service'
        working-directory: .
        run: |
          docker compose up -d zookeeper kafka
          
          for i in {1..60}; do
            if docker exec fintech-kafka \
              kafka-broker-api-versions \
              --bootstrap-server localhost:29092 \
              >/dev/null 2>&1; then
          
              echo "Kafka is ready"
              exit 0
            fi
          
            sleep 2
          done
          
          echo "Kafka failed to become ready"
          docker compose logs zookeeper kafka
          exit 1

      # -----------------------------------------------------
      # Build + Tests
      # -----------------------------------------------------

      - name: Run tests and build
        run: ./gradlew clean build --no-daemon

      # -----------------------------------------------------
      # Online test reporting
      # -----------------------------------------------------

      - name: Publish test results
        if: always()
        uses: dorny/test-reporter@v2
        with:
          name: Test Results - ${{ matrix.service }}
          path: ${{ matrix.service }}/build/test-results/test/**/*.xml
          reporter: java-junit
          fail-on-error: false
          working-directory: .

      # -----------------------------------------------------
      # Raw reports
      # -----------------------------------------------------

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ matrix.service }}
          path: |
            ${{ matrix.service }}/build/reports/tests/test
            ${{ matrix.service }}/build/test-results/test
          if-no-files-found: ignore
          retention-days: 7

      # -----------------------------------------------------
      # Debug infrastructure
      # -----------------------------------------------------

      - name: Show infrastructure logs on failure
        if: failure()
        working-directory: .
        run: |
          docker compose ps || true
          docker compose logs postgres --tail=100 || true
          docker compose logs redis --tail=100 || true
          docker compose logs kafka --tail=100 || true
          docker compose logs zookeeper --tail=100 || true

      # -----------------------------------------------------
      # Cleanup
      # -----------------------------------------------------

      - name: Stop test infrastructure
        if: always()
        working-directory: .
        run: |
          docker compose down || true


  docker-publish:
    name: Docker - ${{ matrix.service }}

    needs:
      - detect-changes
      - service-ci

    if: |
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.service-ci.result == 'success' &&
      needs.detect-changes.outputs.services != '[]'

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.detect-changes.outputs.services) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/distributed-fintech-${{ matrix.service }}
          tags: |
            type=sha,format=short,prefix=
            type=raw,value=main

      - name: Get short SHA
        id: sha
        shell: bash
        run: |
          echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/distributed-fintech-${{ matrix.service }}:${{ steps.sha.outputs.short_sha }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Push Docker images
        run: |
          echo "${{ steps.meta.outputs.tags }}" | while read IMAGE; do
            docker push "$IMAGE"
          done