name: Fintech Pipeline

run-name: "${{ github.ref_name }} · ${{ github.event_name }} · ${{ github.sha }}"

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read
  checks: write
  packages: write

concurrency:
  group: fintech-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/distributed-fintech

jobs:

  # =========================================================
  # Detect affected services
  # =========================================================

  changes:
    name: Detect Changes
    runs-on: ubuntu-latest

    outputs:
      api_gateway: ${{ steps.detect.outputs.api_gateway }}
      identity: ${{ steps.detect.outputs.identity }}
      payment: ${{ steps.detect.outputs.payment }}
      ledger: ${{ steps.detect.outputs.ledger }}
      notification: ${{ steps.detect.outputs.notification }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect affected services
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          API_GATEWAY=false
          IDENTITY=false
          PAYMENT=false
          LEDGER=false
          NOTIFICATION=false

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi

          HEAD="${{ github.sha }}"

          if [[ -z "$BASE" || "$BASE" =~ ^0+$ ]]; then
            echo "No valid base commit. Running all services."

            API_GATEWAY=true
            IDENTITY=true
            PAYMENT=true
            LEDGER=true
            NOTIFICATION=true
          else
            CHANGED_FILES="$(git diff --name-only "$BASE" "$HEAD")"

            echo "Changed files:"
            echo "$CHANGED_FILES"

            # Shared files can affect the complete application.
            if echo "$CHANGED_FILES" | grep -Eq \
              '^(\.github/workflows/ci\.yml|\.trivyignore|docker-compose\.yml|docker/|infrastructure/)'; then

              echo "Shared configuration changed."

              API_GATEWAY=true
              IDENTITY=true
              PAYMENT=true
              LEDGER=true
              NOTIFICATION=true
            else

              if echo "$CHANGED_FILES" | grep -q '^api-gateway/'; then
                API_GATEWAY=true
              fi

              if echo "$CHANGED_FILES" | grep -q '^identity-service/'; then
                IDENTITY=true
              fi

              if echo "$CHANGED_FILES" | grep -q '^payment-service/'; then
                PAYMENT=true
              fi

              if echo "$CHANGED_FILES" | grep -q '^ledger-service/'; then
                LEDGER=true
              fi

              if echo "$CHANGED_FILES" | grep -q '^notification-service/'; then
                NOTIFICATION=true
              fi
            fi
          fi

          echo "api_gateway=$API_GATEWAY" >> "$GITHUB_OUTPUT"
          echo "identity=$IDENTITY" >> "$GITHUB_OUTPUT"
          echo "payment=$PAYMENT" >> "$GITHUB_OUTPUT"
          echo "ledger=$LEDGER" >> "$GITHUB_OUTPUT"
          echo "notification=$NOTIFICATION" >> "$GITHUB_OUTPUT"

          echo ""
          echo "API Gateway:   $API_GATEWAY"
          echo "Identity:      $IDENTITY"
          echo "Payment:       $PAYMENT"
          echo "Ledger:        $LEDGER"
          echo "Notification:  $NOTIFICATION"


  # =========================================================
  # API Gateway
  # =========================================================

  api-gateway:
    name: API Gateway
    needs: changes

    if: needs.changes.outputs.api_gateway == 'true'

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: api-gateway

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Enable Gradle wrapper
        run: chmod +x gradlew

      - name: Start Redis
        working-directory: .
        run: |
          docker compose up -d redis

          for i in {1..30}; do
            if docker exec fintech-redis redis-cli ping | grep -q PONG; then
              echo "Redis ready"
              exit 0
            fi

            sleep 2
          done

          exit 1

      - name: Test and Build
        run: ./gradlew clean build --no-daemon

      - name: Publish Test Results
        if: always()
        uses: dorny/test-reporter@v2
        with:
          name: API Gateway Tests
          path: api-gateway/build/test-results/test/**/*.xml
          reporter: java-junit
          fail-on-error: false
          working-directory: .

      # Docker publishing happens only for main pushes.

      - name: Setup Docker Buildx
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get Image Tag
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: sha
        shell: bash
        run: |
          echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build Container
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: ./api-gateway
          file: ./api-gateway/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: |
            ${{ env.IMAGE_PREFIX }}-api-gateway:${{ steps.sha.outputs.short_sha }}
            ${{ env.IMAGE_PREFIX }}-api-gateway:main
          cache-from: type=gha,scope=api-gateway
          cache-to: type=gha,mode=max,scope=api-gateway

      - name: Trivy Security Scan
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}-api-gateway:${{ steps.sha.outputs.short_sha }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          ignorefile: .trivyignore
          exit-code: "1"

      - name: Push Container
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push "${{ env.IMAGE_PREFIX }}-api-gateway:${{ steps.sha.outputs.short_sha }}"
          docker push "${{ env.IMAGE_PREFIX }}-api-gateway:main"

      - name: Cleanup
        if: always()
        working-directory: .
        run: docker compose down || true


  # =========================================================
  # Identity Service
  # =========================================================

  identity:
    name: Identity Service
    needs: changes

    if: needs.changes.outputs.identity == 'true'

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: identity-service

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Enable Gradle wrapper
        run: chmod +x gradlew

      - name: Start PostgreSQL
        working-directory: .
        run: |
          docker compose up -d postgres

          for i in {1..30}; do
            if docker exec fintech-postgres \
              pg_isready -U fintech_user -d postgres; then

              echo "PostgreSQL ready"
              exit 0
            fi

            sleep 2
          done

          exit 1

      - name: Test and Build
        run: ./gradlew clean build --no-daemon

      - name: Publish Test Results
        if: always()
        uses: dorny/test-reporter@v2
        with:
          name: Identity Tests
          path: identity-service/build/test-results/test/**/*.xml
          reporter: java-junit
          fail-on-error: false
          working-directory: .

      - name: Setup Docker Buildx
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get Image Tag
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: sha
        shell: bash
        run: |
          echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build Container
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: ./identity-service
          file: ./identity-service/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: |
            ${{ env.IMAGE_PREFIX }}-identity-service:${{ steps.sha.outputs.short_sha }}
            ${{ env.IMAGE_PREFIX }}-identity-service:main
          cache-from: type=gha,scope=identity-service
          cache-to: type=gha,mode=max,scope=identity-service

      - name: Trivy Security Scan
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}-identity-service:${{ steps.sha.outputs.short_sha }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          ignorefile: .trivyignore
          exit-code: "1"

      - name: Push Container
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push "${{ env.IMAGE_PREFIX }}-identity-service:${{ steps.sha.outputs.short_sha }}"
          docker push "${{ env.IMAGE_PREFIX }}-identity-service:main"

      - name: Cleanup
        if: always()
        working-directory: .
        run: docker compose down || true


  # =========================================================
  # Payment Service
  # =========================================================

  payment:
    name: Payment Service
    needs: changes

    if: needs.changes.outputs.payment == 'true'

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: payment-service

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Enable Gradle wrapper
        run: chmod +x gradlew

      - name: Start PostgreSQL and Kafka
        working-directory: .
        run: |
          docker compose up -d postgres zookeeper kafka

          for i in {1..60}; do

            POSTGRES_READY=false
            KAFKA_READY=false

            if docker exec fintech-postgres \
              pg_isready -U fintech_user -d postgres >/dev/null 2>&1; then
              POSTGRES_READY=true
            fi

            if docker exec fintech-kafka \
              kafka-broker-api-versions \
              --bootstrap-server localhost:29092 \
              >/dev/null 2>&1; then
              KAFKA_READY=true
            fi

            if [[ "$POSTGRES_READY" == "true" && "$KAFKA_READY" == "true" ]]; then
              echo "PostgreSQL and Kafka ready"
              exit 0
            fi

            sleep 2
          done

          exit 1

      - name: Test and Build
        run: ./gradlew clean build --no-daemon

      - name: Publish Test Results
        if: always()
        uses: dorny/test-reporter@v2
        with:
          name: Payment Tests
          path: payment-service/build/test-results/test/**/*.xml
          reporter: java-junit
          fail-on-error: false
          working-directory: .

      - name: Setup Docker Buildx
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get Image Tag
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: sha
        shell: bash
        run: |
          echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build Container
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: ./payment-service
          file: ./payment-service/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: |
            ${{ env.IMAGE_PREFIX }}-payment-service:${{ steps.sha.outputs.short_sha }}
            ${{ env.IMAGE_PREFIX }}-payment-service:main
          cache-from: type=gha,scope=payment-service
          cache-to: type=gha,mode=max,scope=payment-service

      - name: Trivy Security Scan
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}-payment-service:${{ steps.sha.outputs.short_sha }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          ignorefile: .trivyignore
          exit-code: "1"

      - name: Push Container
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push "${{ env.IMAGE_PREFIX }}-payment-service:${{ steps.sha.outputs.short_sha }}"
          docker push "${{ env.IMAGE_PREFIX }}-payment-service:main"

      - name: Cleanup
        if: always()
        working-directory: .
        run: docker compose down || true


  # =========================================================
  # Ledger Service
  # =========================================================

  ledger:
    name: Ledger Service
    needs: changes

    if: needs.changes.outputs.ledger == 'true'

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ledger-service

    steps:
