      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Enable Gradle wrapper
        run: chmod +x gradlew

      - name: Start PostgreSQL, Kafka and Redis
        working-directory: .
        run: |
          docker compose up -d postgres redis zookeeper kafka

          for i in {1..60}; do

            POSTGRES_READY=false
            REDIS_READY=false
            KAFKA_READY=false

            if docker exec fintech-postgres \
              pg_isready -U fintech_user -d postgres >/dev/null 2>&1; then
              POSTGRES_READY=true
            fi

            if docker exec fintech-redis \
              redis-cli ping | grep -q PONG; then
              REDIS_READY=true
            fi

            if docker exec fintech-kafka \
              kafka-broker-api-versions \
              --bootstrap-server localhost:29092 \
              >/dev/null 2>&1; then
              KAFKA_READY=true
            fi

            if [[ "$POSTGRES_READY" == "true" &&
                  "$REDIS_READY" == "true" &&
                  "$KAFKA_READY" == "true" ]]; then

              echo "Ledger infrastructure ready"
              exit 0
            fi

            sleep 2
          done

          exit 1

      - name: Test and Build
        run: ./gradlew clean build --no-daemon

      - name: Publish Test Results
        if: always()
        uses: dorny/test-reporter@v2
        with:
          name: Ledger Tests
          path: ledger-service/build/test-results/test/**/*.xml
          reporter: java-junit
          fail-on-error: false
          working-directory: .

      - name: Setup Docker Buildx
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get Image Tag
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: sha
        shell: bash
        run: |
          echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build Container
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: ./ledger-service
          file: ./ledger-service/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: |
            ${{ env.IMAGE_PREFIX }}-ledger-service:${{ steps.sha.outputs.short_sha }}
            ${{ env.IMAGE_PREFIX }}-ledger-service:main
          cache-from: type=gha,scope=ledger-service
          cache-to: type=gha,mode=max,scope=ledger-service

      - name: Trivy Security Scan
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}-ledger-service:${{ steps.sha.outputs.short_sha }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          ignorefile: .trivyignore
          exit-code: "1"

      - name: Push Container
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push "${{ env.IMAGE_PREFIX }}-ledger-service:${{ steps.sha.outputs.short_sha }}"
          docker push "${{ env.IMAGE_PREFIX }}-ledger-service:main"

      - name: Cleanup
        if: always()
        working-directory: .
        run: docker compose down || true


