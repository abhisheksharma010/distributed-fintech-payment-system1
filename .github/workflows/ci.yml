service-ci:
  name: CI - ${{ matrix.service }}

  needs:
    - detect-changes

  if: ${{ needs.detect-changes.outputs.services != '[]' }}

  runs-on: ubuntu-latest

  strategy:
    fail-fast: false
    matrix:
      service: ${{ fromJSON(needs.detect-changes.outputs.services) }}

  defaults:
    run:
      working-directory: ${{ matrix.service }}

  steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Set up Java 21
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: "21"

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v6

    - name: Make Gradle wrapper executable
      run: chmod +x gradlew

    - name: Verify Java
      run: java -version

    # -----------------------------------------------------
    # PostgreSQL
    # -----------------------------------------------------

    - name: Start PostgreSQL
      if: |
        matrix.service == 'identity-service' ||
        matrix.service == 'payment-service' ||
        matrix.service == 'ledger-service' ||
        matrix.service == 'notification-service'
      working-directory: .
      run: |
        docker compose up -d postgres
        
        for i in {1..30}; do
          if docker exec fintech-postgres \
            pg_isready -U fintech_user -d postgres; then
            echo "PostgreSQL is ready"
            exit 0
          fi
        
          sleep 2
        done
        
        echo "PostgreSQL failed to become ready"
        docker compose logs postgres
        exit 1

    # -----------------------------------------------------
    # Redis
    # -----------------------------------------------------

    - name: Start Redis
      if: |
        matrix.service == 'api-gateway' ||
        matrix.service == 'ledger-service'
      working-directory: .
      run: |
        docker compose up -d redis
        
        for i in {1..30}; do
          if docker exec fintech-redis \
            redis-cli ping | grep -q PONG; then
            echo "Redis is ready"
            exit 0
          fi
        
          sleep 2
        done
        
        echo "Redis failed to become ready"
        docker compose logs redis
        exit 1

    # -----------------------------------------------------
    # Kafka + ZooKeeper
    # -----------------------------------------------------

    - name: Start Kafka
      if: |
        matrix.service == 'payment-service' ||
        matrix.service == 'ledger-service' ||
        matrix.service == 'notification-service'
      working-directory: .
      run: |
        docker compose up -d zookeeper kafka
        
        for i in {1..60}; do
          if docker exec fintech-kafka \
            kafka-broker-api-versions \
            --bootstrap-server localhost:29092 \
            >/dev/null 2>&1; then
        
            echo "Kafka is ready"
            exit 0
          fi
        
          sleep 2
        done
        
        echo "Kafka failed to become ready"
        docker compose logs zookeeper kafka
        exit 1

    # -----------------------------------------------------
    # Build + Tests
    # -----------------------------------------------------

    - name: Run tests and build
      run: ./gradlew clean build --no-daemon

    # -----------------------------------------------------
    # Online test reporting
    # -----------------------------------------------------

    - name: Publish test results
      if: always()
      uses: dorny/test-reporter@v2
      with:
        name: Test Results - ${{ matrix.service }}
        path: ${{ matrix.service }}/build/test-results/test/**/*.xml
        reporter: java-junit
        fail-on-error: false
        working-directory: .

    # -----------------------------------------------------
    # Raw reports
    # -----------------------------------------------------

    - name: Upload test reports on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: test-report-${{ matrix.service }}
        path: |
          ${{ matrix.service }}/build/reports/tests/test
          ${{ matrix.service }}/build/test-results/test
        if-no-files-found: ignore
        retention-days: 7

    # -----------------------------------------------------
    # Debug infrastructure
    # -----------------------------------------------------

    - name: Show infrastructure logs on failure
      if: failure()
      working-directory: .
      run: |
        docker compose ps || true
        docker compose logs postgres --tail=100 || true
        docker compose logs redis --tail=100 || true
        docker compose logs kafka --tail=100 || true
        docker compose logs zookeeper --tail=100 || true

    # -----------------------------------------------------
    # Cleanup
    # -----------------------------------------------------

    - name: Stop test infrastructure
      if: always()
      working-directory: .
      run: |
        docker compose down || true