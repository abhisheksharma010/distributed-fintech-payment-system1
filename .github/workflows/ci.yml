      - name: Get Image Tag
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: sha
        shell: bash
        run: |
          echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

