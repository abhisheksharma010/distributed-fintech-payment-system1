services:

  postgres:
    image: postgres:16
    container_name: fintech-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${DB_USERNAME:-fintech_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-fintech_password}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USERNAME:-fintech_user} -d postgres"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

    networks:
      - fintech-network


  redis:
    image: redis:7
    container_name: fintech-redis
    restart: unless-stopped

    ports:
      - "6379:6379"

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

    networks:
      - fintech-network


  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: fintech-zookeeper
    restart: unless-stopped

    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      KAFKA_OPTS: "-Dzookeeper.4lw.commands.whitelist=ruok,srvr,stat"

    ports:
      - "2181:2181"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "echo srvr | nc localhost 2181 | grep Zookeeper"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

    networks:
      - fintech-network


  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: fintech-kafka
    restart: unless-stopped

    depends_on:
      zookeeper:
        condition: service_healthy

    ports:
      - "9092:9092"

    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: >-
        INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT

      KAFKA_LISTENERS: >-
        INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092

      KAFKA_ADVERTISED_LISTENERS: >-
        INTERNAL://kafka:29092,EXTERNAL://localhost:9092

      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "kafka-broker-api-versions --bootstrap-server localhost:29092 >/dev/null 2>&1 || exit 1"
        ]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s

    networks:
      - fintech-network


  zipkin:
    image: openzipkin/zipkin:latest
    container_name: fintech-zipkin
    restart: unless-stopped

    ports:
      - "9411:9411"

    networks:
      - fintech-network


  identity-service:
    build:
      context: ./identity-service
      dockerfile: Dockerfile

    image: fintech/identity-service:local
    container_name: fintech-identity-service
    restart: unless-stopped

    environment:
      IDENTITY_DB_URL: jdbc:postgresql://postgres:5432/identity_db
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/identity_db

      DB_USERNAME: ${DB_USERNAME:-fintech_user}
      DB_PASSWORD: ${DB_PASSWORD:-fintech_password}

      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-fintech_user}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-fintech_password}

      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-3600000}

      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://zipkin:9411/api/v2/spans

      JAVA_OPTS: "-Duser.timezone=UTC"

    depends_on:
      postgres:
        condition: service_healthy
      zipkin:
        condition: service_started

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:8082/actuator/health >/dev/null 2>&1 || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

    ports:
      - "8082:8082"

    networks:
      - fintech-network


  ledger-service:
    build:
      context: ./ledger-service
      dockerfile: Dockerfile

    image: fintech/ledger-service:local
    container_name: fintech-ledger-service
    restart: unless-stopped

    environment:
      LEDGER_DB_URL: jdbc:postgresql://postgres:5432/ledger_db
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ledger_db

      DB_USERNAME: ${DB_USERNAME:-fintech_user}
      DB_PASSWORD: ${DB_PASSWORD:-fintech_password}

      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-fintech_user}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-fintech_password}

      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092

      REDIS_HOST: redis
      REDIS_PORT: 6379

      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379

      LEDGER_RECOVERY_INTERNAL_KEY: ${LEDGER_RECOVERY_INTERNAL_KEY}

      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://zipkin:9411/api/v2/spans

      JAVA_OPTS: "-Duser.timezone=UTC"

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      kafka:
        condition: service_started
      zipkin:
        condition: service_started

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:8084/actuator/health >/dev/null 2>&1 || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s

    ports:
      - "8084:8084"

    networks:
      - fintech-network


  payment-service:
    build:
      context: ./payment-service
      dockerfile: Dockerfile

    image: fintech/payment-service:local
    container_name: fintech-payment-service
    restart: unless-stopped

    environment:
      PAYMENT_DB_URL: jdbc:postgresql://postgres:5432/payment_db
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/payment_db

      DB_USERNAME: ${DB_USERNAME:-fintech_user}
      DB_PASSWORD: ${DB_PASSWORD:-fintech_password}

      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-fintech_user}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-fintech_password}

      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092

      LEDGER_SERVICE_URL: http://ledger-service:8084
      LEDGER_RECOVERY_INTERNAL_KEY: ${LEDGER_RECOVERY_INTERNAL_KEY}

      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://zipkin:9411/api/v2/spans

      JAVA_OPTS: "-Duser.timezone=UTC"

    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      zipkin:
        condition: service_started

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:8083/actuator/health >/dev/null 2>&1 || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s

    ports:
      - "8083:8083"

    networks:
      - fintech-network


  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile

    image: fintech/notification-service:local
    container_name: fintech-notification-service
    restart: unless-stopped

    environment:
      NOTIFICATION_DB_URL: jdbc:postgresql://postgres:5432/notification_db
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/notification_db

      DB_USERNAME: ${DB_USERNAME:-fintech_user}
      DB_PASSWORD: ${DB_PASSWORD:-fintech_password}

      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-fintech_user}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-fintech_password}

      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092

      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://zipkin:9411/api/v2/spans

      JAVA_OPTS: "-Duser.timezone=UTC"

    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      zipkin:
        condition: service_started

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:8085/actuator/health >/dev/null 2>&1 || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s

    ports:
      - "8085:8085"

    networks:
      - fintech-network


  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile

    image: fintech/api-gateway:local
    container_name: fintech-api-gateway
    restart: unless-stopped

    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379

      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379

      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-3600000}

      IDENTITY_SERVICE_URL: http://identity-service:8082
      PAYMENT_SERVICE_URL: http://payment-service:8083
      LEDGER_SERVICE_URL: http://ledger-service:8084
      NOTIFICATION_SERVICE_URL: http://notification-service:8085

      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://zipkin:9411/api/v2/spans

      JAVA_OPTS: "-Duser.timezone=UTC"

    depends_on:
      redis:
        condition: service_healthy
      zipkin:
        condition: service_started

    ports:
      - "8081:8081"

    networks:
      - fintech-network


  prometheus:
    image: prom/prometheus:latest
    container_name: fintech-prometheus
    restart: unless-stopped

    command:
      - "--config.file=/etc/prometheus/prometheus.yml"

    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

    ports:
      - "9090:9090"

    networks:
      - fintech-network


  grafana:
    image: grafana/grafana:latest
    container_name: fintech-grafana
    restart: unless-stopped

    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-local-grafana-password}

    ports:
      - "3000:3000"

    volumes:
      - grafana_data:/var/lib/grafana

    depends_on:
      prometheus:
        condition: service_started

    networks:
      - fintech-network


networks:
  fintech-network:
    name: fintech-network
    driver: bridge


volumes:
  postgres_data:
  grafana_data: