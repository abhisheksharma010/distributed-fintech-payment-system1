global:
  scrape_interval: 5s

scrape_configs:

  - job_name: identity-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - identity-service:8082

  - job_name: payment-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - payment-service:8083

  - job_name: ledger-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - ledger-service:8084

  - job_name: notification-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - notification-service:8085